[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-resolver-mcp-server"
version = "1.0.0"
description = "DNS Resolver MCP server that provides DNS resolution services through the Model Context Protocol"
authors = [{name = "Qwen Code", email = "dns-resolver@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mcp>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "typing-extensions>=4.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.27.0",
    "dnspython>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
dns-resolver-mcp-server = "dns_resolver_server.src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dns_resolver_server*"]