# MCP pipeline deployments edge proxy.
# Install to /etc/nginx/conf.d/mcp-deployments.conf
# Per-task location files are managed at runtime by devops-release-engineer
# in /etc/nginx/mcp-deployments/<task_id>.conf  (create the dir too:
#   mkdir -p /etc/nginx/mcp-deployments)
# DEPLOYMENT_HOST in .env must be this machine's reachable address:
# deployments are advertised as http://DEPLOYMENT_HOST:3080/<task>/
server {
    listen 3080;
    server_name _;
    client_max_body_size 50M;
    include /etc/nginx/mcp-deployments/*.conf;
    location / {
        return 404 '{"error":"no such deployment"}';
        add_header Content-Type application/json;
    }
}
