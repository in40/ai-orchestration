version: '3.8'

services:
  registry:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://mcp_user:mcp_password@db:5432/mcp_registry
      - REDIS_URL=redis://redis:6379
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8080
      - LOG_LEVEL=INFO
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=mcp_registry
      - POSTGRES_USER=mcp_user
      - POSTGRES_PASSWORD=mcp_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  postgres_data: