[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-explorer"
version = "0.1.0"
description = "A TUI explorer for Model Context Protocol (MCP) servers using Streamable HTTP"
readme = "README.md"
authors = [{name = "MCP Explorer Team", email = "dev@example.com"}]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "textual>=0.70.0",
    "pydantic>=2.0.0",
    "anyio>=4.0.0",
    "typing-extensions>=4.0.0",
    "pyperclip>=1.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]

[project.scripts]
mcp-explorer = "mcp_explorer.main:main"
mcp-explorer-readonly = "mcp_explorer.main_readonly:main"

[tool.setuptools.packages.find]
where = ["."]